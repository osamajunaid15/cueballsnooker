<style>

*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,sans-serif;min-height:100vh;transition:background .2s,color .2s}

button,input,select,textarea{font:inherit;color:inherit}

.mute{color:var(--mute)}.sm{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel2);padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--text)}

input,select,textarea{width:100%;background:var(--input);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--felt)}
option:disabled{color:#999}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:12px;font-weight:500}
label.chk{display:flex;align-items:center;gap:10px;color:var(--text);font-size:14px}
label.chk input{width:18px;height:18px;margin:0;accent-color:var(--felt)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.cardhead h4{margin:0}
.empty{text-align:center;color:var(--mute);padding:40px 16px}
header.top{position:sticky;top:0;z-index:5;background:var(--hdr);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;padding:12px 16px;max-width:1200px;margin:auto}
.logo{width:32px;height:32px;flex:0 0 auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 16%,#f2f2f2 18%,#cfcfcf 70%,#8f8f8f);box-shadow:0 3px 8px rgba(0,0,0,.3)}

.brand{font-weight:800;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--pend-bg);color:var(--pend-tx);text-transform:uppercase;font-weight:700;letter-spacing:.5px}
nav.tabs{display:flex;gap:6px;padding:0 16px 10px;max-width:1200px;margin:auto;overflow-x:auto}
nav.tabs button{flex:0 0 auto;background:none;border:none;padding:8px 14px;border-radius:99px;color:var(--mute);font-weight:600;cursor:pointer}

main{max-width:1200px;margin:auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}

.meta{font-size:12px;color:#e2f3ea;opacity:.9}

.idle{font-size:12px;color:#d8efe2;opacity:.8;margin-top:6px}
.btnrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.btnrow.two{grid-template-columns:1fr 1fr}.btnrow .btn{padding:9px 6px}

.peaknow{color:var(--no-tx)}
.gift{text-align:center;font-style:italic;color:var(--mute);opacity:.6;font-size:13px;margin:18px 0 8px}
.resv{font-size:12px;color:var(--pend-tx);background:var(--resv-bg);border-radius:8px;padding:6px 10px;font-weight:600}
.blist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.rows>div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.rows>div:last-child{border-bottom:0}.rows span{color:var(--mute)}.rows b{text-align:right}
.note{font-size:13px;color:var(--mute);font-style:italic}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.toolbar input{width:auto;margin:0;padding:7px 10px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{background:none;border:none;padding:7px 14px;border-radius:99px;color:var(--mute);font-weight:600;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--felt);color:#fff}
.seg.full{display:flex;margin-bottom:16px}.seg.full button{flex:1}
.scroll{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
table.list th,table.list td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.list td.num,table.list th.num{text-align:right;font-variant-numeric:tabular-nums}
.linkbox{display:flex;gap:8px;align-items:center}.linkbox input{margin:0}
.ov{position:fixed;inset:0;background:var(--ov);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:440px;max-height:92vh;overflow:auto;padding:18px}
@media(min-width:600px){.ov{align-items:center;padding:16px}.modal{border-radius:18px}}
.mact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center;margin-top:4px}
.total{display:flex;justify-content:space-between;align-items:center;font-size:16px;margin:4px 0 16px}.total b{color:var(--gold);font-size:26px}
pre.msg{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;font:13px/1.5 Inter,sans-serif;margin-bottom:14px}
.shot{width:100%;border-radius:10px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--felt);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:99;transition:.25s;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.err{background:var(--red)}.toast.show{opacity:1;transform:translate(-50%,0)}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login{width:100%;max-width:360px;text-align:center}.login form{text-align:left;margin-top:4px}
.login p{margin:4px 0 18px}
.demo{font-size:12px;color:var(--gold);margin-top:12px!important}
.link{display:inline-block;margin-top:14px;font-size:14px}
.bookwrap{max-width:560px;margin:auto;padding:24px 16px 40px}
.hero{text-align:center;padding:16px 0 22px}.hero h1{font-size:26px}.hero p{color:var(--mute)}
.est{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}.est b{color:var(--gold);font-size:18px}
.pay{background:var(--pay-bg);border:1px solid var(--pay-line);border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:14px}.pay b{font-size:18px;color:var(--gold);display:block}
.foot{text-align:center;color:var(--mute);font-size:13px;margin-top:16px}
.ok-ico{width:56px;height:56px;border-radius:50%;background:var(--felt);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:28px}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
/* =====================================================================
   CUE BALL SNOOKER — POS + Online Booking
   ---------------------------------------------------------------------
   SETUP: Firebase project ki config yahan paste karein.
   Agar apiKey khali ho to app DEMO MODE mein chalti hai (browser storage,
   passwords: admin123 / staff123).
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDbmnei0HNB3GtdPJBZMxodjwJ7aFG5moA",
  authDomain: "cue-ball-snooker-37e91.firebaseapp.com",
  databaseURL: "https://cue-ball-snooker-37e91-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "cue-ball-snooker-37e91",
  appId: "1:673501388407:web:c210fa155806e9552cb072"
};
const ADMIN_EMAIL = "admin@cueball.app";   // Firebase Auth mein yeh 2 users banayein
const STAFF_EMAIL = "staff@cueball.app";
const CURRENCY = "Rs";
/* ===================================================================== */

const DEMO = !FIREBASE_CONFIG.apiKey;
const DEF = {clubName:'Cue Ball Snooker', whatsapp:'', openTime:'12:00', closeTime:'03:00', dayStartHour:6, roundTo:0,
  payTitle:'', payNumber:'', payBank:'', bookingNote:'', requireScreenshot:true, bookingOpen:true};
const S = {settings:{...DEF}, tables:{}, bookings:{}, sessions:{}, role:null, view:'tables', btab:'pending', unsub:[], mode:'pos'};
let DB, AUTH;

/* ---------------- data layer ---------------- */
if (!DEMO) {
  firebase.initializeApp(FIREBASE_CONFIG);
  const fdb = firebase.database(), fa = firebase.auth();
  let off = 0; fdb.ref('.info/serverTimeOffset').on('value', s => off = s.val() || 0);
  const warn = p => e => console.warn(p, e.message);
  DB = {
    on(p, cb){ const r = fdb.ref(p), h = s => cb(s.val()); r.on('value', h, warn(p)); return () => r.off('value', h); },
    onRange(p, c, f, t, cb){ const q = fdb.ref(p).orderByChild(c).startAt(f).endAt(t), h = s => cb(s.val()); q.on('value', h, warn(p)); return () => q.off('value', h); },
    get: p => fdb.ref(p).get().then(s => s.val()),
    getRange: (p, c, f, t) => fdb.ref(p).orderByChild(c).startAt(f).endAt(t).get().then(s => s.val()),
    set: (p, v) => fdb.ref(p).set(v),
    update: (p, o) => fdb.ref(p || '/').update(o),
    push: (p, v) => { const r = fdb.ref(p).push(); return r.set(v).then(() => r.key); },
    remove: p => fdb.ref(p).remove(),
    key: () => fdb.ref().push().key,
    now: () => Date.now() + off
  };
  const roleOf = u => { if (!u) return null; const e = (u.email || '').toLowerCase();
    return e === ADMIN_EMAIL.toLowerCase() ? 'admin' : e === STAFF_EMAIL.toLowerCase() ? 'staff' : null; };
  AUTH = {
    watch: cb => fa.onAuthStateChanged(u => cb(roleOf(u))),
    login: (role, pw) => fa.signInWithEmailAndPassword(role === 'admin' ? ADMIN_EMAIL : STAFF_EMAIL, pw),
    logout: () => fa.signOut()
  };
} else {
  const LS = 'cueball_demo_v1';
  const clone = v => v == null ? null : JSON.parse(JSON.stringify(v));
  const seed = () => ({settings:{...DEF}, tables:{
    t1:{name:'Table 1',type:'Snooker',ppm:8,ppmPeak:10,order:1,status:'free'},
    t2:{name:'Table 2',type:'Snooker',ppm:8,ppmPeak:10,order:2,status:'free'},
    t3:{name:'Table 3',type:'Snooker',ppm:8,ppmPeak:10,order:3,status:'free'},
    t4:{name:'Pool 1',type:'8-Ball Pool',ppm:5,ppmPeak:7,order:4,status:'free'}},
    canteen:{c1:{name:'Water bottle',price:80},c2:{name:'Cold drink',price:120},c3:{name:'Chips',price:70},c4:{name:'Tea',price:60}}});
  let mem = null; try { mem = JSON.parse(localStorage.getItem(LS)); } catch(e) {}
  if (!mem) mem = seed();
  const L = [];
  const parts = p => String(p).split('/').filter(Boolean);
  const g = p => { let o = mem; for (const k of parts(p)) { if (o == null || typeof o !== 'object') return null; o = o[k]; } return o === undefined ? null : clone(o); };
  const s = (p, v) => { const ks = parts(p); if (!ks.length) { mem = clone(v) || {}; return; } let o = mem;
    for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null || typeof o[ks[i]] !== 'object') o[ks[i]] = {}; o = o[ks[i]]; }
    const last = ks[ks.length - 1]; if (v == null) delete o[last]; else o[last] = clone(v); };
  const filt = (v, f) => { if (!f || !v) return v; const out = {}; for (const k in v) { const x = v[k] && v[k][f.child]; if (x >= f.from && x <= f.to) out[k] = v[k]; } return out; };
  const fire = () => L.forEach(l => l.cb(filt(g(l.path), l.f)));
  const emit = () => { try { localStorage.setItem(LS, JSON.stringify(mem)); } catch(e) {} fire(); };
  window.addEventListener('storage', e => { if (e.key === LS) { try { mem = JSON.parse(e.newValue) || mem; } catch(_) {} fire(); } });
  const sub = l => { L.push(l); setTimeout(() => l.cb(filt(g(l.path), l.f))); return () => { const i = L.indexOf(l); if (i >= 0) L.splice(i, 1); }; };
  DB = {
    on: (path, cb) => sub({path, cb}),
    onRange: (path, child, from, to, cb) => sub({path, cb, f:{child, from, to}}),
    get: async p => g(p),
    getRange: async (p, child, from, to) => filt(g(p), {child, from, to}),
    set: async (p, v) => { s(p, v); emit(); },
    update: async (p, o) => { for (const k in o) s(p + '/' + k, o[k]); emit(); },
    push: async (p, v) => { const k = DB.key(); s(p + '/' + k, v); emit(); return k; },
    remove: async p => { s(p, null); emit(); },
    key: () => '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
    now: () => Date.now()
  };
  let cur = null, cbs = []; try { cur = sessionStorage.getItem('cb_role'); } catch(e) {}
  AUTH = {
    watch(cb){ cbs.push(cb); setTimeout(() => cb(cur)); },
    async login(role, pw){ if (pw !== (role === 'admin' ? 'admin123' : 'staff123')) throw {code:'auth/wrong-password'};
      cur = role; try { sessionStorage.setItem('cb_role', role); } catch(e) {} cbs.forEach(f => f(cur)); },
    async logout(){ cur = null; try { sessionStorage.removeItem('cb_role'); } catch(e) {} cbs.forEach(f => f(null)); }
  };
}

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const money = n => CURRENCY + ' ' + Math.round(+n || 0).toLocaleString('en-US');
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const isAdmin = () => S.role === 'admin';
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const bizDate = ts => ymd(new Date(ts - (+S.settings.dayStartHour || 0) * 3600000));
const prettyDate = s => new Date(s + 'T00:00:00').toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
const fmtTime = ts => new Date(ts).toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
const fmtDur = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60); };
const hm12 = s => { let [h, m] = String(s).split(':').map(Number); h %= 24; return ((h % 12) || 12) + ':' + pad(m) + (h >= 12 ? ' PM' : ' AM'); };
const hhmm2m = s => { const [h, m] = String(s || '0:0').split(':').map(Number); return h * 60 + (m || 0); };
function tmin(s){ let t = hhmm2m(s); const o = hhmm2m(S.settings.openTime), c = hhmm2m(S.settings.closeTime); if (c <= o && t < o) t += 1440; return t; }
const overlap = (a, ah, b, bh) => a < b + bh * 60 && b < a + ah * 60;
const bookTs = b => new Date(b.date + 'T00:00:00').getTime() + tmin(b.time) * 60000;
const waLink = (phone, text) => `https://api.whatsapp.com/send?phone=${waNum(phone)}${text ? '&text=' + encodeURIComponent(text) : ''}`;

/* ---------------- live tables ---------------- */
const ppmOf = t => t && t.ppm != null ? +t.ppm : (+(t && t.rate) || 0) / 60;
const minsOf = ms => ms > 0 ? Math.ceil(ms / 60000) : 0;
const amtOf = (mins, ppm) => Math.round(mins * (+ppm || 0));
const roundBill = n => { const r = +S.settings.roundTo || 0; return r > 0 ? Math.ceil(n / r) * r : Math.round(n); };
const ppmPeakOf = t => t && t.ppmPeak != null && t.ppmPeak !== '' ? +t.ppmPeak : ppmOf(t);
const hasPeak = t => ppmPeakOf(t) !== ppmOf(t);
const nfmt = n => +(+n).toFixed(2);
const rateTxt = t => hasPeak(t) ? `${CURRENCY} ${nfmt(ppmOf(t))}/min · Peak ${nfmt(ppmPeakOf(t))}` : `${CURRENCY} ${nfmt(ppmOf(t))}/min`;
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DEF_PEAK = {0:{on:true, all:true}, 1:{on:true, from:'18:00', to:'02:00'}, 2:{on:true, from:'18:00', to:'02:00'}, 3:{on:true, from:'18:00', to:'02:00'},
  4:{on:true, from:'18:00', to:'02:00'}, 5:{on:true, from:'18:00', to:'02:00'}, 6:{on:true, all:true}};
const peakCfg = () => S.settings.peak || DEF_PEAK;
function peakWindows(a, b){
  const out = [], dsh = (+S.settings.dayStartHour || 0) * 60, cfg = peakCfg();
  for (let d = addDays(bizDate(a), -1), last = bizDate(b); d <= last; d = addDays(d, 1)) {
    const c = cfg[new Date(d + 'T00:00:00').getDay()]; if (!c || !c.on) continue;
    const base = new Date(d + 'T00:00:00').getTime(); let s, e;
    if (c.all) { s = dsh; e = dsh + 1440; }
    else { s = hhmm2m(c.from); e = hhmm2m(c.to); if (s < dsh) s += 1440; if (e <= s) e += 1440; }
    out.push([base + s * 60000, base + e * 60000]);

  return out;
}
const isPeakAt = ts => peakWindows(ts, ts + 1).some(([s, e]) => ts >= s && ts < e);
function priceSegs(t, segs){
  const ms = segs.reduce((a, [s, e]) => a + (e - s), 0), mins = minsOf(ms);
  const pk = segs.reduce((a, [s, e]) => a + peakWindows(s, e).reduce((x, [ps, pe]) => x + Math.max(0, Math.min(e, pe) - Math.max(s, ps)), 0), 0);
  const peakMins = ms ? Math.min(mins, Math.round(mins * pk / ms)) : 0, offMins = mins - peakMins;
  return {ms, mins, peakMins, offMins, amount:Math.round(peakMins * ppmPeakOf(t) + offMins * ppmOf(t))};
}
function chargeSegs(l, now){
  if (!l.frameStart) return [];
  const end = frameEnd(l, now); if (end <= l.frameStart) return [];
  const ps = l.pauses || [];
  if (!ps.length && +l.pausedMs) return [[Math.min(end, l.frameStart + +l.pausedMs), end]];
  let segs = [[l.frameStart, end]];
  ps.forEach(p => { segs = segs.flatMap(([s, e]) => { if (p.b <= s || p.a >= e) return [[s, e]]; const r = []; if (p.a > s) r.push([s, p.a]); if (p.b < e) r.push([p.b, e]); return r; }); });
  return segs;
}
const canteenList = () => Object.entries(S.canteen || {}).map(([id, c]) => ({id, ...c})).sort((a, b) => String(a.name).localeCompare(String(b.name)));
function liveOf(t){
  if (!t) return null;
  let l = t.live ? JSON.parse(JSON.stringify(t.live)) : null;
  if (!l && t.status === 'running' && t.start) l = {start:t.start, frameStart:t.start, customer:t.customer || '', pausedMs:0};
  if (!l) return null;
  l.frames = Array.isArray(l.frames) ? l.frames.filter(Boolean) : Object.values(l.frames || {});
  l.items = Array.isArray(l.items) ? l.items.filter(Boolean) : Object.values(l.items || {});
  l.pauses = Array.isArray(l.pauses) ? l.pauses.filter(Boolean) : Object.values(l.pauses || {});

}
const frameEnd = (l, now) => Math.min(...[l.pausedAt, l.stopAt, now].filter(Boolean));
const curFrameMs = (l, now) => chargeSegs(l, now).reduce((a, [s, e]) => a + (e - s), 0);
function totals(t, l, now, lastName){
  const frames = l.frames.slice();
  if (l.frameStart) { const p = priceSegs(t, chargeSegs(l, now)); if (p.mins > 0) frames.push({name:lastName || '', mins:p.mins, peakMins:p.peakMins, offMins:p.offMins, amount:p.amount, from:l.frameStart, to:frameEnd(l, now), cur:true}); }
  const game = frames.reduce((a, f) => a + (+f.amount || 0), 0);
  const canteen = l.items.reduce((a, i) => a + (+i.price || 0) * (+i.qty || 1), 0);
  const gameR = roundBill(game);
  return {frames, game, gameR, round:gameR - game, canteen, total:gameR + canteen, mins:frames.reduce((a, f) => a + (+f.mins || 0), 0)};
}
const stateOf = l => !l ? 'free' : l.stopAt ? 'billing' : l.pausedAt ? 'paused' : l.frameStart ? 'running' : 'off';
const saveLive = (id, l) => DB.update('tables/' + id, {status:!l ? 'free' : l.stopAt ? 'billing' : 'running', live:l || null, start:null, customer:null, startedBy:null});

function tCard(t){

function startTable(id){

function wirePay(getTotal){
  const upd = () => { const T = getTotal(), r = (+$('#p_cash').value || 0) + (+$('#p_onl').value || 0), d = T - r;
    $('#p_rec').textContent = money(r); $('#p_disc').textContent = d >= 0 ? money(d) : 'More than bill by ' + money(-d); $('#p_disc').style.color = d < 0 ? 'var(--red)' : ''; };
  const reset = () => { $('#p_cash').value = getTotal(); $('#p_onl').value = 0; upd(); };
  $('#p_cash').oninput = upd; $('#p_onl').oninput = upd;
  $('#p_allc').onclick = reset; $('#p_allo').onclick = () => { $('#p_onl').value = getTotal(); $('#p_cash').value = 0; upd(); };
  reset();
  return {upd, reset, get(){ const T = getTotal(), cash = +$('#p_cash').value || 0, online = +$('#p_onl').value || 0, received = cash + online;
    if (cash < 0 || online < 0) throw new Error('Amount cannot be negative');
    if (received > T) throw new Error('Received is more than the bill');
    if (!isAdmin() && T > 0 && received === 0) throw new Error('Only admin can give a full discount');
    return {cash, online, received, discount:T - received, method:cash && online ? 'Split' : online ? 'Online' : 'Cash'}; }};
}
function brkTable(tt, l){
  const by = {}, add = (n, k, v, m, pm) => { n = n || '—'; by[n] = by[n] || {g:0, c:0, m:0, f:0, p:0}; by[n][k] += v; if (m != null) { by[n].m += m; by[n].f++; by[n].p += pm || 0; } };
  tt.frames.forEach(f => add(f.name, 'g', +f.amount || 0, +f.mins || 0, +f.peakMins || 0));
  l.items.forEach(i => add(i.player, 'c', (+i.price || 0) * (+i.qty || 1)));
  const rows = Object.entries(by); if (!rows.length) return '';
  return `<div class="scroll" style="margin-bottom:12px"><table class="list"><thead><tr><th>Name</th><th class="num">Game</th><th class="num">Canteen</th><th class="num">Total</th></tr></thead><tbody>
    ${rows.map(([n, x]) => `<tr><td>${esc(n)}${x.f ? `<div class="mute sm">${x.f} frame${x.f > 1 ? 's' : ''} · ${x.m} min${x.p ? ` (${x.p === x.m ? 'peak' : x.p + ' peak'})` : ''}</div>` : ''}</td><td class="num">${money(x.g)}</td><td class="num">${money(x.c)}</td><td class="num"><b>${money(x.g + x.c)}</b></td></tr>`).join('')}
    ${tt.round ? `<tr><td class="mute">Rounding</td><td class="num">${money(tt.round)}</td><td></td><td class="num">${money(tt.round)}</td></tr>` : ''}
    </tbody></table></div>
    ${l.items.length ? `<div class="mute sm" style="margin:-4px 0 12px">Canteen: ${l.items.map(i => `${i.qty}× ${esc(i.name)}`).join(', ')}</div>` : ''}`;
}
async function stopTable(id){
  const l = liveOf(S.tables[id]); if (!l) return;
  if (!l.stopAt) { l.stopAt = DB.now(); try { await saveLive(id, l); } catch(e) { return toast(e.message, 1); } }
  billModal(id);
}
function billModal(id){
  const t = S.tables[id], l = liveOf(t); if (!l || !l.stopAt) return;
  const needName = !!l.frameStart && minsOf(curFrameMs(l, l.stopAt)) > 0;
  const lastDef = l.frames.length ? l.frames[l.frames.length - 1].name : (l.customer || '');
  openModal(`<h3>Bill — ${esc(t.name)}</h3>
    <div class="rows" style="margin-bottom:12px"><div><span>Time</span><b>${fmtTime(l.start)} – ${fmtTime(l.stopAt)}</b></div><div><span>Rate</span><b>${rateTxt(t)}</b></div></div>
    ${needName ? `<label>Last frame paid by<input id="bl_last" list="bl_names" value="${esc(lastDef)}" maxlength="30">${namesDatalist('bl_names', l)}</label>` : ''}
    <div id="bl_brk"></div>
    ${l.booking && l.booking.advance ? `<div class="rows" style="margin-bottom:6px"><div><span>Total bill</span><b id="bl_tot"></b></div><div><span>Advance paid (${esc(l.booking.name)})</span><b>− ${money(l.booking.advance)}</b></div></div>
      <div class="total"><span>To pay</span><b id="bl_due"></b></div>` : `<div class="total"><span>Total bill</span><b id="bl_tot"></b></div>`}
    ${payBlock()}
    <div class="mact">${isAdmin() ? `<button class="btn ghost sm" id="bl_void">Void (no charge)</button>` : ''}
      <button class="btn" id="bl_back">Back (resume)</button><button class="btn primary" id="bl_pay">Payment received</button></div>`, true);
  const adv = l.booking ? +l.booking.advance || 0 : 0;
  const calc = () => totals(t, l, l.stopAt, needName ? $('#bl_last').value.trim() : '');
  const due = () => Math.max(0, calc().total - adv);
  const draw = () => { const tt = calc(); $('#bl_brk').innerHTML = brkTable(tt, l); $('#bl_tot').textContent = money(tt.total); if ($('#bl_due')) $('#bl_due').textContent = money(due()); };
  draw();
  const pay = wirePay(due);
  if (needName) $('#bl_last').oninput = draw;
  $('#bl_back').onclick = async () => { const l2 = liveOf(S.tables[id]);
    if (l2 && l2.stopAt) { const now = DB.now(); if (l2.frameStart && !l2.pausedAt) { l2.pauses.push({a:l2.stopAt, b:now}); l2.pausedMs = (+l2.pausedMs || 0) + now - l2.stopAt; } delete l2.stopAt; await act(() => saveLive(id, l2)); }
    closeModal(); };
  $('#bl_pay').onclick = async () => { let p; try { p = pay.get(); } catch(e) { return toast(e.message, 1); }
    const btn = $('#bl_pay'); btn.disabled = true; const tt = calc();
    try {
      const key = DB.key(), up = {};
      up['sessions/' + key] = {tableId:id, table:t.name, type:t.type, customer:l.customer || '', start:l.start, end:l.stopAt, minutes:tt.mins, ppm:ppmOf(t), ppmPeak:ppmPeakOf(t),
        frames:tt.frames.map(({cur, ...f}) => f), items:l.items, game:tt.gameR, canteen:tt.canteen, bill:tt.total, advance:adv, due:Math.max(0, tt.total - adv),
        bookingId:l.booking ? l.booking.id : '', ...p, amount:p.received, by:S.role, date:bizDate(l.start)};
      if (l.booking && S.bookings[l.booking.id]) up[`bookings/${l.booking.id}/usedIn`] = key;
      await DB.update('', up);
      await saveLive(id, null); closeModal(); toast('Saved ' + money(p.received));
    } catch(e) { toast(e.message, 1); btn.disabled = false; } };
  if ($('#bl_void')) $('#bl_void').onclick = async () => { if (confirm('Clear this table without saving a sale?')) { await act(() => saveLive(id, null)); closeModal(); toast('Table cleared'); } };
}
function canteenModal(id){
  const list = canteenList(); if (!list.length) return toast(isAdmin() ? 'Add canteen items in Settings first' : 'No canteen items set up yet', 1);
  const t = id ? S.tables[id] : null, l = id ? liveOf(t) : null; if (id && !l) return;
  const cart = {};
  openModal(`<h3>Canteen${t ? ' — ' + esc(t.name) : ' sale'}</h3>
    ${l && l.items.length ? `<div class="added"><div class="mute sm">Already added</div>${l.items.map((i, k) => `<div class="citem"><span>${i.qty}× ${esc(i.name)}${i.player ? ` <span class="mute sm">· ${esc(i.player)}</span>` : ''}</span><span>${money(i.price * i.qty)} <button class="btn sm ghost" onclick="rmItem('${id}',${k})">✕</button></span></div>`).join('')}</div>` : ''}
    <div class="clist">${list.map(c => `<div class="citem"><span>${esc(c.name)} <span class="mute sm">${money(c.price)}</span></span><span class="qty"><button class="btn sm" data-d="-1" data-c="${c.id}">−</button><b id="q_${c.id}">0</b><button class="btn sm" data-d="1" data-c="${c.id}">+</button></span></div>`).join('')}</div>
    ${t ? `<label style="margin-top:12px">Player name (optional)<input id="c_player" list="c_names" maxlength="30">${namesDatalist('c_names', l)}</label>` : ''}
    <div class="total"><span>Total</span><b id="c_tot">${money(0)}</b></div>
    ${t ? '' : payBlock()}
    <div class="mact"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="c_go">${t ? 'Add to table' : 'Payment received'}</button></div>`);
  const total = () => list.reduce((a, c) => a + (cart[c.id] || 0) * (+c.price || 0), 0);
  const pay = t ? null : wirePay(total);
  document.querySelectorAll('.clist [data-c]').forEach(b => b.onclick = () => { const k = b.dataset.c; cart[k] = Math.max(0, (cart[k] || 0) + +b.dataset.d);
    $('#q_' + k).textContent = cart[k]; $('#c_tot').textContent = money(total()); if (pay) pay.reset(); });
  $('#c_go').onclick = async () => {
    const sel = list.filter(c => cart[c.id]).map(c => ({name:c.name, price:+c.price || 0, qty:cart[c.id]}));
    if (!sel.length) return toast('Select at least one item', 1);
    if (t) {
      const l2 = liveOf(S.tables[id]); if (!l2) return closeModal(); const pl = $('#c_player').value.trim();
      sel.forEach(s => { if (pl) s.player = pl; l2.items.push(s); });
      try { await saveLive(id, l2); closeModal(); toast('Added ' + money(total())); } catch(e) { toast(e.message, 1); }
    } else {
      let p; try { p = pay.get(); } catch(e) { return toast(e.message, 1); }
      const now = DB.now();
      try { await DB.push('sessions', {tableId:'', table:'Canteen', type:'Canteen', customer:'', start:now, end:now, minutes:0, items:sel, game:0, canteen:total(), bill:total(),
          ...p, amount:p.received, by:S.role, date:bizDate(now)}); closeModal(); toast('Saved ' + money(p.received)); } catch(e) { toast(e.message, 1); }
    }
  };
}
async function rmItem(id, k){ const l = liveOf(S.tables[id]); if (!l) return; l.items.splice(k, 1); try { await saveLive(id, l); canteenModal(id); } catch(e) { toast(e.message, 1); } }

/* ---------------- bookings (staff side) ---------------- */
const whenKey = b => b.date + pad(tmin(b.time)).padStart(5, '0');
function viewBookings(){
  const today = bizDate(DB.now());
  const all = Object.entries(S.bookings || {}).map(([id, b]) => ({id, ...b}));
  const up = b => b.status === 'approved' && b.date >= today && !b.usedIn;
  const L = {
    pending: all.filter(b => b.status === 'pending').sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)),
    upcoming: all.filter(up).sort((a, b) => whenKey(a).localeCompare(whenKey(b))),
    past: all.filter(b => b.status !== 'pending' && !up(b)).sort((a, b) => whenKey(b).localeCompare(whenKey(a)))
  };
  const t = S.btab;
  return `<div class="toolbar"><div class="seg">${['pending','upcoming','past'].map(k => `<button class="${t === k ? 'on' : ''}" onclick="S.btab='${k}';renderView()">${cap(k)} (${L[k].length})</button>`).join('')}</div>
    <div style="flex:1"></div><button class="btn sm" onclick="copyText(bookUrl())">Copy booking link</button></div>
    ${L[t].length ? `<div class="blist">${L[t].map(bCard).join('')}</div>` : `<div class="empty">${t === 'pending' ? 'No pending requests.' : 'Nothing here.'}</div>`}`;
}
function bCard(b){
  const st = b.usedIn ? ['p-ok','Played'] : ({pending:['p-pend','Pending'], approved:['p-ok','Approved'], rejected:['p-no','Rejected'], cancelled:['p-no','Cancelled']}[b.status] || ['p-pend', b.status]);
  const canRefund = isAdmin() && b.advance && +b.advance.amount > 0 && !b.refund && !b.usedIn;
  return `<div class="bcard">
    <div class="thead"><div><div class="tname">${esc(b.name)}</div><a class="ttype" href="tel:${esc(b.phone)}">${esc(b.phone)}</a></div><span class="pill ${st[0]}">${st[1]}</span></div>
    <div class="rows"><div><span>Date</span><b>${prettyDate(b.date)}</b></div><div><span>Time</span><b>${hm12(b.time)} · ${b.hours} hr</b></div>
    <div><span>Table</span><b>${esc(b.table)}</b></div><div><span>Amount</span><b>${money(b.amount)}</b></div>
    ${b.advance ? `<div><span>Advance</span><b>${money(b.advance.amount)} · ${esc(b.advance.method)}</b></div>` : ''}
    ${b.refund ? `<div><span>Refunded</span><b style="color:var(--red)">${money(b.refund.amount)} · ${esc(b.refund.method)}</b></div>` : ''}</div>
    ${b.note ? `<div class="note">“${esc(b.note)}”</div>` : ''}
    <div class="mact">${b.hasShot ? `<button class="btn sm" onclick="viewShot('${b.id}')">Payment proof</button>` : `<span class="mute sm">No screenshot</span>`}
      <div style="flex:1"></div>
      ${isAdmin() ? `<button class="btn sm ghost" onclick="delBooking('${b.id}')">Delete</button>` : ''}
      ${canRefund ? `<button class="btn sm danger" onclick="refundModal('${b.id}')">Refund</button>` : ''}
      ${b.status === 'pending' ? `<button class="btn sm danger" onclick="decide('${b.id}','rejected')">Reject</button><button class="btn sm primary" onclick="decide('${b.id}','approved')">Approve</button>`
        : `<button class="btn sm" onclick="waModal('${b.id}')">WhatsApp</button>`}</div></div>`;
}
function findClash(id){
  const b = S.bookings[id];
  return Object.entries(S.bookings || {}).map(([k, x]) => ({id:k, ...x})).find(x => x.id !== id && x.status === 'approved' && x.date === b.date
    && x.tableId === b.tableId && overlap(tmin(x.time), x.hours, tmin(b.time), b.hours));
}
async function decide(id, st){
  const b = S.bookings[id]; if (!b) return;
  if (st === 'approved') return approveModal(id);
  if (!confirm('Reject this booking?')) return;
  try { await DB.update('', {[`bookings/${id}/status`]:'rejected', [`bookings/${id}/handledBy`]:S.role, [`slots/${b.date}/${id}`]:null}); waModal(id, 'rejected'); }
  catch(e) { toast(e.message, 1); }
}
function moneyEntry(o){ const now = DB.now(), amt = o.amount;
  return {tableId:'', table:o.label, type:o.type, customer:o.name, bookingId:o.bookingId, start:now, end:now, minutes:0, game:0, canteen:0, bill:amt, discount:0,
    cash:o.method === 'Cash' ? amt : 0, online:o.method === 'Cash' ? 0 : amt, received:amt, amount:amt, method:o.method, by:S.role, date:bizDate(now)}; }
function approveModal(id){
  const b = S.bookings[id]; if (!b) return; const c = findClash(id);
  openModal(`<h3>Approve booking</h3>
    <div class="rows" style="margin-bottom:12px"><div><span>Customer</span><b>${esc(b.name)}</b></div><div><span>When</span><b>${prettyDate(b.date)} · ${hm12(b.time)} · ${b.hours} hr</b></div>
      <div><span>Table</span><b>${esc(b.table)}</b></div><div><span>Booking amount</span><b>${money(b.amount)}</b></div></div>
    ${c ? `<div class="resv" style="margin-bottom:12px">⚠ ${esc(c.table)} is already booked for ${esc(c.name)} at ${hm12(c.time)} on this date.</div>` : ''}
    ${b.hasShot ? `<button class="btn sm" style="margin-bottom:12px" onclick="viewShot('${id}')">View payment proof</button>` : ''}
    <div class="row2"><label>Advance received<input id="ad_amt" type="number" min="0" inputmode="numeric" value="${esc(b.amount)}"></label>
      <label>Received in<select id="ad_m"><option>Online</option><option>Cash</option></select></label></div>
    <p class="mute sm" style="margin:-4px 0 12px">Added to today's sales, and deducted from the bill when they play. Enter 0 if no advance.</p>
    <div class="mact"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="ad_go">Approve</button></div>`);
  $('#ad_go').onclick = async () => {
    const amt = +$('#ad_amt').value || 0, method = $('#ad_m').value; if (amt < 0) return toast('Invalid amount', 1);

    if (amt > 0) { const key = DB.key(); up['sessions/' + key] = moneyEntry({label:'Booking advance', type:'Advance', name:b.name, bookingId:id, amount:amt, method});
      up[`bookings/${id}/advance`] = {amount:amt, method, at:DB.now(), by:S.role, sid:key}; }
    try { await DB.update('', up); closeModal(); waModal(id, 'approved'); } catch(e) { toast(e.message, 1); btn.disabled = false; }

function refundModal(id){
  const b = S.bookings[id]; if (!b || !b.advance || !isAdmin()) return;
  openModal(`<h3>Refund — ${esc(b.name)}</h3>
    <div class="rows" style="margin-bottom:12px"><div><span>Booking</span><b>${prettyDate(b.date)} · ${hm12(b.time)} · ${esc(b.table)}</b></div><div><span>Advance received</span><b>${money(b.advance.amount)} · ${esc(b.advance.method)}</b></div></div>
    <div class="row2"><label>Refund amount<input id="rf_amt" type="number" min="1" max="${esc(b.advance.amount)}" inputmode="numeric" value="${esc(b.advance.amount)}"></label>
      <label>Refund from<select id="rf_m"><option ${b.advance.method !== 'Cash' ? 'selected' : ''}>Online</option><option ${b.advance.method === 'Cash' ? 'selected' : ''}>Cash</option></select></label></div>
    <p class="mute sm" style="margin:-4px 0 12px">The booking will be cancelled and the refund will be subtracted from today's sales.</p>
    <div class="mact"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn danger" id="rf_go">Refund &amp; cancel booking</button></div>`);
  $('#rf_go').onclick = async () => {
    const amt = +$('#rf_amt').value || 0, method = $('#rf_m').value;
    if (amt <= 0 || amt > +b.advance.amount) return toast('Refund must be between 1 and ' + money(b.advance.amount), 1);
    const btn = $('#rf_go'); btn.disabled = true; const key = DB.key(), up = {};
    up['sessions/' + key] = moneyEntry({label:'Booking refund', type:'Refund', name:b.name, bookingId:id, amount:-amt, method});
    up[`bookings/${id}/refund`] = {amount:amt, method, at:DB.now(), by:S.role, sid:key}; up[`bookings/${id}/status`] = 'cancelled'; up[`slots/${b.date}/${id}`] = null;
    try { await DB.update('', up); closeModal(); waModal(id, 'cancelled'); } catch(e) { toast(e.message, 1); btn.disabled = false; }
  };
}
const msgDate = s => prettyDate(s).replace(',', '');
function waMsg(b, st){
  const c = S.settings.clubName, adv = b.advance ? +b.advance.amount || 0 : 0;
  if (st === 'approved') return `Assalam o Alaikum ${b.name}! 😎\nYour booking at *${c}* is CONFIRMED.\n\n📅 ${msgDate(b.date)}\n⏲️ ${hm12(b.time)} (${b.hours} hr)\n🎱 ${b.table}\n💶 ${money(b.amount)}${adv && adv !== +b.amount ? `\n✅ Advance received: ${money(adv)}` : ''}\n\n- Please arrive 10 minutes early. See you!`;
  if (st === 'rejected') return `Assalam o Alaikum ${b.name} 🙏\nSorry, we could not confirm your booking at *${c}* for ${msgDate(b.date)}, ${hm12(b.time)}.\n\n- Please contact us to choose another slot.`;
  if (st === 'cancelled') return `Assalam o Alaikum ${b.name} 🙏\nYour booking at *${c}* for ${msgDate(b.date)}, ${hm12(b.time)} has been cancelled.${b.refund ? `\n\n💶 Refund: ${money(b.refund.amount)} (${b.refund.method})` : ''}\n\n- Hope to see you soon! 🎱`;
  return `Assalam o Alaikum ${b.name}, we have received your booking request at *${c}* and will confirm shortly.`;
}
function waModal(id, st){
  const b = S.bookings[id]; if (!b) return; st = st || b.status;
  const msg = waMsg(b, st);
  openModal(`<h3>WhatsApp ${esc(b.name)}</h3><pre class="msg">${esc(msg)}</pre>

    <a class="btn primary" href="${waLink(b.phone, msg)}" target="_blank" rel="noopener" onclick="setTimeout(closeModal,300)">Open WhatsApp</a></div>`);
  $('#wa_copy').onclick = () => copyText(msg, 'Message');

async function delBooking(id){
  const b = S.bookings[id]; if (!b || !confirm(`Delete booking of ${b.name}?`)) return;

/* ---------------- sales ---------------- */
const sv = r => ({rec:recOf(r), cash:r.cash != null ? +r.cash : (r.method === 'Cash' ? +r.amount || 0 : 0), onl:r.online != null ? +r.online : (r.method !== 'Cash' ? +r.amount || 0 : 0),
  cant:+r.canteen || 0, disc:+r.discount || 0, bill:+(r.bill ?? r.amount) || 0});
const playersOf = r => { const n = [...new Set((Array.isArray(r.frames) ? r.frames : Object.values(r.frames || {})).map(f => f && f.name).filter(Boolean))]; return n.length ? n.join(', ') : (r.customer || '—'); };
function viewSales(){
  const today = bizDate(DB.now());
  if (!isAdmin() || !S.from) { S.from = today; S.to = today; }
  return `<div class="toolbar">${isAdmin() ? `<input type="date" id="f_from" value="${S.from}"><span class="mute">to</span><input type="date" id="f_to" value="${S.to}">
    <button class="btn sm primary" onclick="S.from=$('#f_from').value;S.to=$('#f_to').value;loadSales()">Show</button>` : `<b>Today · ${prettyDate(today)}</b>`}
    <div style="flex:1"></div><button class="btn sm" onclick="exportCSV()">Export CSV</button></div><div id="salesBody"><div class="empty">Loading…</div></div>`;
}
async function loadSales(){
  const from = S.from, to = S.to; let v;
  try { v = await DB.getRange('sessions', 'date', from, to); } catch(e) { const el = $('#salesBody'); if (el) el.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if (from !== S.from || to !== S.to) return;
  const rows = Object.entries(v || {}).map(([id, r]) => ({id, ...r})).sort((a, b) => b.end - a.end);
  S.salesRows = rows;
  const el = $('#salesBody'); if (!el) return;
  const sum = k => rows.reduce((a, r) => a + sv(r)[k], 0);
  const games = rows.filter(r => r.tableId), mins = games.reduce((a, r) => a + (+r.minutes || 0), 0);
  const byT = {}; rows.forEach(r => { const k = r.table || '?'; byT[k] = byT[k] || {n:0, m:0, a:0}; byT[k].n++; byT[k].m += +r.minutes || 0; byT[k].a += sv(r).rec; });
  const multi = from !== to;
  el.innerHTML = `<div class="stats">
    <div class="stat"><span>Total received</span><b>${money(sum('rec'))}</b></div>
    <div class="stat"><span>Cash</span><b>${money(sum('cash'))}</b></div>
    <div class="stat"><span>Online</span><b>${money(sum('onl'))}</b></div>
    <div class="stat"><span>Canteen</span><b>${money(sum('cant'))}</b></div>
    <div class="stat"><span>Discounts</span><b>${money(sum('disc'))}</b></div>
    <div class="stat"><span>Play time</span><b>${Math.floor(mins / 60)}h ${mins % 60}m</b></div></div>
    ${rows.length ? `<div class="card scroll"><h4>By table</h4><table class="list"><thead><tr><th>Table</th><th class="num">Bills</th><th class="num">Time</th><th class="num">Received</th></tr></thead><tbody>
      ${Object.entries(byT).sort((a, b) => b[1].a - a[1].a).map(([k, x]) => `<tr><td>${esc(k)}</td><td class="num">${x.n}</td><td class="num">${x.m ? Math.floor(x.m / 60) + 'h ' + x.m % 60 + 'm' : '—'}</td><td class="num">${money(x.a)}</td></tr>`).join('')}</tbody></table></div>
    <div class="card scroll"><h4>All bills</h4><table class="list"><thead><tr>${multi ? '<th>Date</th>' : ''}<th>Table</th><th>Players</th><th>Time</th><th class="num">Min</th><th class="num">Bill</th><th class="num">Cash</th><th class="num">Online</th><th class="num">Disc.</th><th>By</th>${isAdmin() ? '<th></th>' : ''}</tr></thead><tbody>
      ${rows.map(r => { const x = sv(r); return `<tr>${multi ? `<td>${prettyDate(r.date)}</td>` : ''}<td>${esc(r.table)}</td><td>${esc(playersOf(r))}</td><td>${r.tableId ? fmtTime(r.start) + ' – ' + fmtTime(r.end) : fmtTime(r.end)}</td>
        <td class="num">${r.minutes || '—'}</td><td class="num">${money(x.bill)}</td><td class="num">${money(x.cash)}</td><td class="num">${money(x.onl)}</td><td class="num">${x.disc ? money(x.disc) : '—'}</td><td>${esc(r.by)}</td>
        ${isAdmin() ? `<td><button class="btn sm ghost" onclick="delSession('${r.id}')">✕</button></td>` : ''}</tr>`; }).join('')}</tbody></table></div>`
    : `<div class="empty">No sales in this period.</div>`}`;
}
async function delSession(id){ if (!confirm('Delete this sale entry?')) return; try { await DB.remove('sessions/' + id); toast('Deleted'); loadSales(); } catch(e) { toast(e.message, 1); } }
function exportCSV(){
  const rows = S.salesRows || []; if (!rows.length) return toast('Nothing to export', 1);
  const head = ['Date','Table','Players','Start','End','Minutes','Game','Canteen','Bill','Advance used','Cash','Online','Received','Discount','By'];
  const lines = [head, ...rows.slice().reverse().map(r => { const x = sv(r); return [r.date, r.table, playersOf(r), fmtTime(r.start), fmtTime(r.end), r.minutes, r.game ?? '', x.cant, x.bill, r.advance || '', x.cash, x.onl, x.rec, x.disc, r.by]; })]
    .map(a => a.map(x => `"${String(x ?? '').replace(/"/g, '""')}"`).join(','));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], {type:'text/csv'}));
  a.download = `cueball_sales_${S.from}_to_${S.to}.csv`; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------------- customer booking page ---------------- */
async function startBook(){
  try { const [st, tb] = await Promise.all([DB.get('settings'), DB.get('tables')]); S.settings = {...DEF, ...(st || {})}; S.tables = tb || {}; }
  catch(e) { $('#app').innerHTML = `<div class="center"><div class="empty">Could not load. Check internet and refresh.</div></div>`; return; }
  renderBook();
}
function renderBook(){
  const s = S.settings, tables = sortedTables(), today = bizDate(DB.now());
  const hero = `<div class="hero"><div class="logo big"></div><h1 class="clubName">${esc(s.clubName)}</h1><p>Book your table online</p></div>`;
  if (!s.bookingOpen || !tables.length) {
    $('#app').innerHTML = `${themeBtn('float')}<div class="bookwrap">${hero}<div class="card" style="text-align:center"><p>${!tables.length ? 'Tables are not set up yet. Please check back soon.' : 'Online booking is closed right now.'}</p>
      ${s.whatsapp ? `<a class="btn gold" style="margin-top:12px" href="${waLink(s.whatsapp)}" target="_blank" rel="noopener">Contact us on WhatsApp</a>` : ''}</div></div>`; return;
  }
  $('#app').innerHTML = `${themeBtn('float')}<div class="bookwrap">${hero}<form id="bf" class="card">
    <div class="row2"><label>Your name*<input id="b_name" required maxlength="40" autocomplete="name"></label>
    <label>WhatsApp number*<input id="b_phone" required inputmode="tel" placeholder="03xx xxxxxxx" autocomplete="tel"></label></div>
    <label>Table*<select id="b_table">${tables.map(t => `<option value="${t.id}">${esc(t.name)} — ${esc(t.type)} (${rateTxt(t)})</option>`).join('')}</select></label>
    <div class="row2"><label>Date*<input type="date" id="b_date" min="${today}" max="${addDays(today, 30)}" value="${today}" required></label>
    <label>Duration<select id="b_hours">${[1, 1.5, 2, 2.5, 3, 4].map(h => `<option value="${h}">${h} hour${h > 1 ? 's' : ''}</option>`).join('')}</select></label></div>
    <label>Start time*<select id="b_time" required></select></label>
    <div class="est"><span>Estimated amount</span><b id="b_est">—</b></div>
    ${s.payNumber ? `<div class="pay"><div class="mute sm">Send advance payment to</div><b>${esc(s.payNumber)}</b><div>${esc(s.payTitle)}${s.payBank ? ' · ' + esc(s.payBank) : ''}</div></div>` : ''}
    <label>Payment screenshot${s.requireScreenshot ? '*' : ' (optional)'}<input type="file" id="b_shot" accept="image/*" ${s.requireScreenshot ? 'required' : ''}></label>
    <label>Note (optional)<textarea id="b_note" rows="2" maxlength="200"></textarea></label>
    ${s.bookingNote ? `<p class="mute sm" style="margin-bottom:12px">${esc(s.bookingNote)}</p>` : ''}
    <button class="btn gold full" id="b_btn">Send booking request</button></form>
</div>`;
  ['b_table','b_date','b_hours'].forEach(i => $('#' + i).onchange = refreshSlots); $('#b_time').onchange = updEst;
  $('#bf').onsubmit = submitBooking;
  refreshSlots();
}
function updEst(){
  const t = S.tables[$('#b_table').value], date = $('#b_date').value, time = $('#b_time').value, hrs = +$('#b_hours').value;
  if (!t) return $('#b_est').textContent = '—';
  if (!date || !time) return $('#b_est').textContent = hasPeak(t) ? 'Select time' : money(roundBill(amtOf(hrs * 60, ppmOf(t))));
  const s = bookTs({date, time}); $('#b_est').textContent = money(roundBill(priceSegs(t, [[s, s + hrs * 3600000]]).amount));
}
async function refreshSlots(){
  const s = S.settings, sel = $('#b_time'), date = $('#b_date').value, tid = $('#b_table').value, hrs = +$('#b_hours').value, t = S.tables[tid];
  updEst();
  if (!date) { sel.innerHTML = '<option value="">Select a date first</option>'; return; }
  sel.innerHTML = '<option value="">Loading…</option>';
  let taken = {}; try { taken = (await DB.get('slots/' + date)) || {}; } catch(e) {}
  if ($('#b_date').value !== date || $('#b_table').value !== tid || +$('#b_hours').value !== hrs) return;
  const o = hhmm2m(s.openTime); let c = hhmm2m(s.closeTime); if (c <= o) c += 1440;
  const base = new Date(date + 'T00:00:00').getTime(), now = DB.now();
  const busy = Object.values(taken).filter(x => x && x.tableId === tid).map(x => [tmin(x.time), x.hours]);
  let opts = '', any = false;
  for (let m = o; m + hrs * 60 <= c; m += 30) {
    if (base + m * 60000 < now + 15 * 60000) continue;
    const hh = pad(Math.floor(m / 60) % 24) + ':' + pad(m % 60), clash = busy.some(([a, h]) => overlap(a, h, m, hrs));
    if (!clash) any = true;
    opts += `<option value="${hh}" ${clash ? 'disabled' : ''}>${hm12(hh)}${clash ? ' — booked' : ''}</option>`;
  }
  sel.innerHTML = any ? '<option value="">Select time</option>' + opts : '<option value="">No slots available — try another date</option>';
  updEst();
}
function compress(file){
  return new Promise((res, rej) => { const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, 1000 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg', 0.65)); };
    img.onerror = () => rej(new Error('Please attach a valid image')); img.src = url; });
}
async function submitBooking(e){
  e.preventDefault();
  const btn = $('#b_btn'), name = $('#b_name').value.trim(), phone = $('#b_phone').value.trim(), date = $('#b_date').value,
    time = $('#b_time').value, hours = +$('#b_hours').value, tid = $('#b_table').value, t = S.tables[tid], f = $('#b_shot').files[0];
  if (phone.replace(/\D/g, '').length < 10) return toast('Enter a valid WhatsApp number', 1);
  if (!time) return toast('Please select a start time', 1);
  if (S.settings.requireScreenshot && !f) return toast('Please attach the payment screenshot', 1);
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const shot = f ? await compress(f) : null, id = DB.key();
    const bk = {name, phone, date, time, hours, tableId:tid, table:t.name, type:t.type, ppm:ppmOf(t), ppmPeak:ppmPeakOf(t), amount:roundBill(priceSegs(t, [[bookTs({date, time}), bookTs({date, time}) + hours * 3600000]]).amount),
      note:$('#b_note').value.trim(), status:'pending', createdAt:DB.now(), hasShot:!!shot};
    await DB.set('bookings/' + id, bk);
    if (shot) await DB.set('shots/' + id, shot);
    renderBooked(bk, id);
  } catch(err) { toast('Could not send: ' + err.message, 1); btn.disabled = false; btn.textContent = 'Send booking request'; }
}
function renderBooked(b, id){
  const s = S.settings, ref = id.slice(-6).toUpperCase();
  const txt = `Hi, I just sent a booking request (Ref ${ref}) for ${b.table} on ${prettyDate(b.date)} at ${hm12(b.time)}. Name: ${b.name}`;
  $('#app').innerHTML = `${themeBtn('float')}<div class="bookwrap"><div class="hero"><div class="ok-ico">✓</div><h1>Request sent!</h1>
    <p>We'll confirm on WhatsApp after checking your payment.</p></div>
    <div class="card"><div class="rows"><div><span>Reference</span><b>${ref}</b></div><div><span>Table</span><b>${esc(b.table)}</b></div>
    <div><span>Date</span><b>${prettyDate(b.date)}</b></div><div><span>Time</span><b>${hm12(b.time)} · ${b.hours} hr</b></div><div><span>Amount</span><b>${money(b.amount)}</b></div></div></div>
    ${s.whatsapp ? `<a class="btn gold full" href="${waLink(s.whatsapp, txt)}" target="_blank" rel="noopener">Message us on WhatsApp</a>` : ''}
    <button class="btn full" style="margin-top:10px" onclick="location.reload()">Book another table</button></div>`;
}

boot();
</script>
